<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活旅行团购</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 2.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .filter-btn {
            padding: 10px 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        .deals-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        .deal-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .deal-card:hover {
            transform: translateY(-10px);
        }
        .deal-image {
            height: 200px;
            overflow: hidden;
        }
        .deal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .deal-card:hover .deal-image img {
            transform: scale(1.1);
        }
        .deal-info {
            padding: 20px;
        }
        .deal-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .deal-desc {
            color: #7f8c8d;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .deal-price {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .current-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
            margin-right: 15px;
        }
        .original-price {
            text-decoration: line-through;
            color: #95a5a6;
        }
        .deal-stats {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        .book-btn {
            display: block;
            background: #3498db;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .book-btn:hover {
            background: #2980b9;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>超值旅行团购</h1>
            <p>发现最优惠的旅行套餐，与朋友家人共享美好时光</p>
        </header>

        <div class="filter-bar">
            <div class="filter-btn active">全部</div>
            <div class="filter-btn">国内游</div>
            <div class="filter-btn">出境游</div>
            <div class="filter-btn">周边游</div>
            <div class="filter-btn">酒店套餐</div>
        </div>

        <div class="deals-container">
            <div class="deal-card">
                <div class="deal-image">
                    <img src="../../static/home/images/1 (1).jpg" alt="三亚五日游">
                </div>
                <div class="deal-info">
                    <h3 class="deal-title">三亚豪华五日游</h3>
                    <p class="deal-desc">入住五星级酒店，包含接送机服务，畅游天涯海角、蜈支洲岛等著名景点</p>
                    <div class="deal-price">
                        <span class="current-price">¥2999</span>
                        <span class="original-price">¥4599</span>
                    </div>
                    <div class="deal-stats">
                        <span>已售: 1245份</span>
                        <span>剩余: 23份</span>
                    </div>
                    <a href="#" class="book-btn">立即抢购</a>
                </div>
            </div>

            <div class="deal-card">
                <div class="deal-image">
                    <img src="../../static/home/images/1 (2).jpg" alt="日本樱花季">
                </div>
                <div class="deal-info">
                    <h3 class="deal-title">日本樱花季七日游</h3>
                    <p class="deal-desc">东京、大阪、京都三地联游，赏樱最佳路线，包含和服体验</p>
                    <div class="deal-price">
                        <span class="current-price">¥6999</span>
                        <span class="original-price">¥8999</span>
                    </div>
                    <div class="deal-stats">
                        <span>已售: 856份</span>
                        <span>剩余: 12份</span>
                    </div>
                    <a href="#" class="book-btn">立即抢购</a>
                </div>
            </div>

            <div class="deal-card">
                <div class="deal-image">
                    <img src="../../static/home/images/1 (3).jpg" alt="云南丽江">
                </div>
                <div class="deal-info">
                    <h3 class="deal-title">云南丽江古城三日游</h3>
                    <p class="deal-desc">漫步丽江古城，体验纳西文化，包含玉龙雪山一日游</p>
                    <div class="deal-price">
                        <span class="current-price">¥1299</span>
                        <span class="original-price">¥1999</span>
                    </div>
                    <div class="deal-stats">
                        <span>已售: 2345份</span>
                        <span>剩余: 45份</span>
                    </div>
                    <a href="#" class="book-btn">立即抢购</a>
                </div>
            </div>
        </div>

        <footer>
            <p>© 2025 生活旅行团购 版权所有</p>
        </footer>
    </div>
</body>
</html>
