<body>
    <dl class="foot" id="serviceLinks">
        <dt>特色服务</dt>
        <dd id="linksContainer"></dd>
    </dl>

    <script>
        // 链接数据数组
        const links = [
            { name: "明日学院", url: "http://www.mingrisoft.com/" },
            { name: "明日图书", url: "http://www.mingribook.com/" },
            { name: "明日编程词典", url: "http://www.mrbccd.com/" },
            { name: "明日淘宝店铺", url: "http://mrbccd.taobao.com/" }
        ];

        // 动态生成链接
        function renderLinks() {
            const container = document.getElementById('linksContainer');

            links.forEach(link => {
                const div = document.createElement('div');
                const a = document.createElement('a');

                a.href = link.url;
                a.target = "_blank";
                a.rel = "stylesheet";
                a.textContent = link.name;

                div.appendChild(a);
                container.appendChild(div);
            });
        }

        // 页面加载完成后执行
        window.onload = renderLinks;
    </script>
</body>
</html>
