<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}首页-51商城{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- 现代化样式表 -->
    <link rel="stylesheet" href="{{url_for('static',filename='home/css/style-modern.css')}}" type="text/css">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 头部开始 -->
    {% include "home/header.html" %}
    <!-- 头部结束 -->

    <!-- 内容开始 -->
    <main>
        {% block content %}{% endblock %}
    </main>
    <!-- 内容结束 -->

    <!-- 底部开始-->
    {% include "home/footer.html" %}
    <!-- 底部结束-->

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery (保持兼容性) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- 现代化交互脚本 -->
    <script src="{{url_for('static',filename='home/js/main-modern.js')}}"></script>

    <!-- 旧的 JavaScript 支持（逐步迁移） -->
    <script src="{{url_for('static',filename='home/js/jsArr01.js')}}" type="text/javascript"></script>
    <script src="{{url_for('static',filename='home/js/jsArr02.js')}}" type="text/javascript"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
