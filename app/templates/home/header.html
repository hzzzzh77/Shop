<!-- 顶部工具栏 -->
<div id="toolbar" class="border-bottom bg-white py-2">
    <div class="container">
        <div class="row align-items-center">
            <!-- 左侧信息 -->
            <div class="col-md-6 col-12">
                <div class="d-flex gap-3 align-items-center flex-wrap">
                    <div class="text-muted small">
                        <i class="fas fa-phone text-primary me-1"></i>
                        <span>电话：400-675-1066</span>
                    </div>
                    {% if "user_id" in session %}
                        <div class="text-muted small">
                            您好，<strong>{{session['username']}}</strong>
                            <a href="{{url_for('home.modify_password')}}" class="ms-2">修改密码</a>
                            <span class="mx-1">|</span>
                            <a href="{{url_for('home.logout')}}">退出登录</a>
                        </div>
                    {% else %}
                        <div class="text-muted small">
                            <a href="{{url_for('home.login')}}">登录</a>
                            <span class="mx-2">|</span>
                            <a href="{{url_for('home.register')}}">注册</a>
                        </div>
                    {% endif %}
                </div>
            </div>
            <!-- 右侧导航链接 -->
            <div class="col-md-6 col-12 text-md-end text-start mt-2 mt-md-0">
                <div class="d-flex gap-3 justify-content-md-end small">
                    <a href="{{url_for('home.order_list')}}" class="text-decoration-none">
                        <i class="fas fa-list me-1"></i>我的订单
                    </a>
                    <a href="{{url_for('home.collect_list')}}" class="text-decoration-none">
                        <i class="fas fa-heart me-1"></i>我的收藏
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 主导航栏 -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
    <div class="container">
        <!-- 品牌/Logo -->
        <a class="navbar-brand fw-bold fs-5" href="{{url_for('home.index')}}">
            <i class="fas fa-store text-primary me-2"></i>51商城
        </a>

        <!-- 切换按钮（移动设备） -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- 导航项目 -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link {% if request.args.get('type') is none %}active{% endif %}" href="{{url_for('home.index')}}">
                        <i class="fas fa-home me-1"></i>首页
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.args.get('type') == '14' %}active{% endif %}" href="/goods_list/14?type=14">
                        <i class="fas fa-book me-1"></i>图书类
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.args.get('type') == '15' %}active{% endif %}" href="/goods_list/15?type=15">
                        <i class="fas fa-plug me-1"></i>家电类
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.args.get('type') == '16' %}active{% endif %}" href="/goods_list/16?type=16">
                        <i class="fas fa-shirt me-1"></i>服装类
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.args.get('type') == '17' %}active{% endif %}" href="/goods_list/17?type=17">
                        <i class="fas fa-mobile-alt me-1"></i>电子类
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 搜索和购物车栏 -->
<div class="bg-white border-bottom py-3">
    <div class="container">
        <div class="row align-items-center gap-3">
            <!-- 搜索框 -->
            <div class="col-md-6">
                <form method="get" action="{{url_for('home.goods_search')}}" class="d-flex gap-2">
                    <input type="text" name="keywords" class="form-control form-control-sm rounded-2" placeholder="搜索商品..." required>
                    <button type="submit" class="btn btn-primary btn-sm px-4 rounded-2">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>

            <!-- 购物车 -->
            <div class="col-md-6 d-flex justify-content-md-end">
                <a href="{{url_for('home.shopping_cart')}}" class="cart-button">
                    <i class="fas fa-shopping-cart"></i>
                    我的购物车
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    // 移除旧的导航高亮脚本，改用 Jinja2 模板逻辑
    // 现在基于 request.args.get('type') 在模板中动态添加 active 类
</script>
